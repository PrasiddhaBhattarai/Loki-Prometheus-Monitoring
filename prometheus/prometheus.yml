global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
      - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "frontend"
    static_configs:
      - targets: ["frontend:5000"]

  - job_name: "backend"
    static_configs:
      - targets: ["backend:5001"]

  - job_name: "postgres"
    static_configs:
      - targets: ["db-exporter:9187"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]